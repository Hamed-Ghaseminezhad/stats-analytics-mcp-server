[project]
name = "stats-analytics-mcp-server"
version = "0.1.0"
description = "Read-only analytics MCP server whose statistical tools report effect sizes, confidence intervals and warnings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "numpy>=2.0",
    "scipy>=1.14",
    "sqlglot>=25",
    "uvicorn>=0.30",
]

[project.scripts]
stats-analytics-mcp-server = "stats_analytics_mcp:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "httpx>=0.28"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.uv.build-backend]
module-name = "stats_analytics_mcp"
