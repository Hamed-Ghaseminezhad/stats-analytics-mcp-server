name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --python ${{ matrix.python-version }}
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t stats-analytics-mcp .
      - name: Server refuses to start without a token
        run: |
          if docker run --rm stats-analytics-mcp; then exit 1; else echo "refused, as expected"; fi
